<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>杀戮原塔2 · 岩系卡牌展示</title><link rel="stylesheet" href="genshin-rooms.css"><link rel="stylesheet" href="project-card-theme.css?geo=power-unified"><style>
*{box-sizing:border-box}body{margin:0;background:#101315;color:#e4dfce;font:15px/1.65 system-ui}header,main,footer{max-width:1180px;margin:auto;padding:24px}header{border-bottom:1px solid #353733}h1{margin:8px 0;font-size:25px}a{color:#d8c590}p{margin:8px 0}nav{display:flex;gap:18px;flex-wrap:wrap}.controls{display:flex;gap:12px;margin-top:20px}button,select{background:#282b29;border:1px solid #77705d;color:#e8e1ce;padding:9px 14px;font:inherit}button{cursor:pointer}button[aria-pressed=true]{border-color:#d2ba78}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #d2ba78;outline-offset:4px}.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:36px 22px}.sample{padding:16px 12px 0;max-width:260px;width:100%;margin:auto}.sample .gr-card{width:100%;display:block;min-height:0}.card-caption{text-align:center;font-size:13px;color:#b7b3a6;margin-top:10px}.source{display:block;font-size:12px;text-align:center}footer{color:#aaa99d;font-size:13px;border-top:1px solid #353733}.empty{grid-column:1/-1;padding:40px;color:#b8b2a1}</style>
<body><header><nav><a href="./?page=battle">对战</a><a href="./?page=rewards">奖励</a><a href="./?page=shop">商店</a><a href="./?page=menu">主菜单</a></nav><h1>旅行者 · 岩 / 卡牌展示</h1><p>15 张项目真实卡牌：3 张初始牌、12 张奖励池样例。公开版卡框及图标为几何占位，不含私人站原版纹理。卡底参照钟离的深色岩体与深色服装，浅金只落在原有窄边，费用球使用简易金色圆形占位。攻击、技能占位插画底分别参照原版打击、防御原画；稀有度只通过原有标题横幅和插画边框区分。</p><div class="controls"><select id="rarity" aria-label="筛选稀有度"><option value="all">全部稀有度</option><option value="basic">基础</option><option value="common">普通</option><option value="uncommon">罕见</option><option value="rare">稀有</option></select><select id="type" aria-label="筛选卡牌类型"><option value="all">全部类型</option><option value="attack">攻击</option><option value="skill">技能</option><option value="power">能力</option></select><button id="upgrade" aria-pressed="false">查看升级后</button></div></header><main><div id="cards" class="card-grid"></div></main><footer><p>数据来源：项目开发分支（87c944f3）。名称与描述取角色中文展示表，费用、类型、稀有度及升级取同版本规则数据。</p><p>此处为占位图标，后续替换正式原神素材。罕见与稀有使用独立几何占位横幅和插画框。卡牌展示页不把奖励池样例加入当前战斗牌组。</p></footer><script type="module" src="cards-gallery.js?geo=power-unified"></script></body></html>
