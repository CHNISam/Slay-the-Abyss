<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>战斗 · 默认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@600;900&amp;display=swap" rel="stylesheet">
<style>@keyframes intentBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
body{margin:0}
a{color:#E9C77B}a:hover{color:#F6DFA4}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0D0708; font-family: 'Noto Sans SC', sans-serif; color: #F3ECDD">

  <!-- 场景：与卡面一致的深青灰厚涂底 + 斜向岩光 -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 1400px 720px at 58% 36%, #4E1A1A 0%, #2A1013 42%, #0D0708 100%)"></div>
  <div style="position: absolute; left: -300px; top: -200px; width: 1400px; height: 700px; background: linear-gradient(115deg, #E9C77B00 30%, #E9C77B14 48%, #E9C77B00 62%); transform: rotate(-8deg)"></div>
  <div style="position: absolute; left: 220px; right: 100px; top: 560px; height: 170px; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, #3E1D19 0%, #26110F 45%, #0D070800 72%)"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 1150px 640px at 50% 46%, #00000000 55%, #050303D9 100%)"></div>

  <sc-for list="{{embers}}" as="d" hint-placeholder-count="28"><span style="{{d}}"></span></sc-for>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: linear-gradient(180deg, #0D070800, #3A0E0A66 55%, #0D0708E6)"></div>

  <!-- 顶栏：锻钢条 -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 110px; background: linear-gradient(180deg, #070303F2 0%, #070303B0 60%, #07030300 100%)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 94px; height: 1px; background: linear-gradient(90deg, #6E5A4200, #6E5A4288 30%, #6E5A4288 70%, #6E5A4200)"></div>
  <div style="position: absolute; left: 52px; top: 16px; height: 64px; display: flex; align-items: center; gap: 34px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#D9604F"></path></svg>
      <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">72<span style="color: #9E8C72; font-weight: 500">/80</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F8DCA0, #C98F3E); box-shadow: 0 0 10px #E9C77B55"></span>
      <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">151</span>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 16px; height: 64px; display: flex; align-items: center; justify-content: center; gap: 16px; pointer-events: none">
    <span style="width: 44px; height: 1px; background: linear-gradient(90deg, #E9C77B00, #E9C77B)"></span>
    <span style="font-family: 'Noto Serif SC', serif; font-size: 15px; letter-spacing: 6px; color: #BBAA8C">第四层</span>
    <span style="font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 900; letter-spacing: 10px; color: #E9C77B">战斗</span>
    <span style="width: 44px; height: 1px; background: linear-gradient(90deg, #E9C77B, #E9C77B00)"></span>
  </div>

  <!-- 药水槽 -->
  <button aria-label="药水：锻造祝福" style="position: absolute; left: 362px; top: 22px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid #8C7454; background: radial-gradient(circle at 50% 35%, #3A2E28, #221A17); display: grid; place-items: center; padding: 0">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8CC4E2" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 3h6M10 3v5l-4.5 8A3 3 0 0 0 8.2 21h7.6a3 3 0 0 0 2.7-5L14 8V3"></path><path d="M7.5 14h9"></path></svg>
  </button>
  <button aria-label="药水：火焰药水" style="position: absolute; left: 424px; top: 22px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid {{fireRing}}; background: radial-gradient(circle at 50% 35%, #4A2C24, #221A17); box-shadow: {{fireGlow}}; display: grid; place-items: center; padding: 0">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EE9670" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 3h6M10 3v5l-4.5 8A3 3 0 0 0 8.2 21h7.6a3 3 0 0 0 2.7-5L14 8V3"></path><path d="M12 12c1.5 1.4 2 2.4 2 3.4a2 2 0 0 1-4 0c0-1 .5-2 2-3.4z"></path></svg>
  </button>
  <button aria-label="空药水槽" style="position: absolute; left: 486px; top: 22px; width: 52px; height: 52px; border-radius: 50%; border: 1.5px dashed #6E5A42; background: #1A131280"></button>
  <span style="position: absolute; left: 340px; top: 34px; width: 1px; height: 28px; background: #6E5A42"></span>
  <button aria-label="查看卡组，13 张" style="position: absolute; left: 1694px; top: 22px; width: 100px; height: 52px; border-radius: 26px; border: 1px solid #6E5A42; background: #241B19; color: #F3ECDD; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BBAA8C" stroke-width="1.8" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2"></rect><path d="M5 7v12a2 2 0 0 0 2 2h9"></path></svg>13
  </button>
  <button aria-label="菜单" style="position: absolute; left: 1808px; top: 22px; width: 52px; height: 52px; border-radius: 50%; border: 1px solid {{menuRing}}; background: #241B19; display: grid; place-items: center; padding: 0">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BBAA8C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
  </button>

  <!-- 玩家 -->
  <div style="position: absolute; left: 240px; top: 310px; width: 260px; display: flex; flex-direction: column; align-items: center">
    <div style="position: relative; width: 260px; height: 250px; display: grid; place-items: center">
      <div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, #E9C77B33 0%, #E9C77B00 62%)"></div>
      <div style="position: absolute; left: 50px; right: 50px; bottom: 6px; height: 22px; border-radius: 50%; background: #030202; opacity: 0.75"></div>
      <img src="/_blob/e983b2a062f4d739e432c6e97d06b355" alt="旅行者" style="position: relative; width: 200px; height: 200px; object-fit: contain">
    </div>
    <div style="margin-top: 10px; font-size: 18px; font-weight: 700; color: #E9C77B; letter-spacing: 3px">旅行者</div>
    <div style="margin-top: 10px; position: relative; width: 220px; height: 18px; border-radius: 9px; background: #2A1714; box-shadow: inset 0 0 0 1px #00000080">
      <div style="width: 90%; height: 100%; border-radius: 9px; background: linear-gradient(180deg, #E67A62, #B04838)"></div>
      <span style="position: absolute; inset: 0; text-align: center; font-size: 13px; line-height: 18px; font-weight: 700; color: #FFF6EE; text-shadow: 0 1px 2px #000">72/80</span>
    </div>
  </div>

  <!-- 敌人 -->
  <sc-for list="{{enemies}}" as="e" hint-placeholder-count="5">
    <div style="{{e.col}}">
      <div style="height: 58px; display: flex; align-items: center; animation: intentBob 2.4s ease-in-out infinite">
          <div style="position: relative; flex: none; width: 58px; height: 58px; filter: drop-shadow(0 0 3px {{e.ic.glow}}) drop-shadow(0 0 14px {{e.ic.glow}}) drop-shadow(0 5px 4px #000000D0)">
            <svg style="position: absolute; inset: 0" width="58" height="58" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.ic.f}}" style="fill: {{e.ic.rim}}; stroke: #240A08; stroke-width: 1.6; paint-order: stroke"></path><path d="{{e.ic.s}}" style="fill: none; stroke: {{e.ic.rim}}; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"></path></svg>
          </div>
          <sc-if value="{{e.ic.value}}" hint-placeholder-val="{{true}}"><span style="margin-left: -8px; font-size: 38px; line-height: 1; font-weight: 900; font-style: italic; color: #FFF8EE; -webkit-text-stroke: 2.5px #240A08; paint-order: stroke fill; text-shadow: 0 0 14px {{e.ic.glow}}, 0 3px 0 #000; font-variant-numeric: tabular-nums">{{e.ic.value}}</span></sc-if>
      </div>
      <div style="position: relative; margin-top: 16px; width: 220px; height: {{e.box}}; display: grid; place-items: end center; opacity: {{e.fade}}">
        <div style="position: absolute; left: 40px; right: 40px; bottom: -4px; height: 18px; border-radius: 50%; background: #030202; opacity: 0.8"></div>
        <img src="{{e.img}}" alt="{{e.name}}" style="{{e.sz}}">
        <sc-if value="{{e.aimed}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; inset: -8px 14px -12px 14px">
            <div style="position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-left: 3px solid #F6DFA4; border-top: 3px solid #F6DFA4; border-top-left-radius: 8px"></div>
            <div style="position: absolute; right: 0; top: 0; width: 26px; height: 26px; border-right: 3px solid #F6DFA4; border-top: 3px solid #F6DFA4; border-top-right-radius: 8px"></div>
            <div style="position: absolute; left: 0; bottom: 0; width: 26px; height: 26px; border-left: 3px solid #F6DFA4; border-bottom: 3px solid #F6DFA4; border-bottom-left-radius: 8px"></div>
            <div style="position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; border-right: 3px solid #F6DFA4; border-bottom: 3px solid #F6DFA4; border-bottom-right-radius: 8px"></div>
          </div>
        </sc-if>
      </div>
      <div style="margin-top: 14px; font-size: 17px; font-weight: 700; color: #EDE4D2; letter-spacing: 1px; text-shadow: 0 1px 3px #000">{{e.name}}</div>
      <div style="margin-top: 8px; display: flex; align-items: center; gap: 6px">
        <div style="flex: none; position: relative; width: 34px; height: 34px; display: grid; place-items: center; visibility: {{e.blockVis}}">
          <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5z" fill="#3A6A88" stroke="#A8D6F0" stroke-width="1.3"></path></svg>
          <span style="position: absolute; top: 7px; font-size: 13px; font-weight: 900; color: #FFFFFF">{{e.block}}</span>
        </div>
        <div style="position: relative; width: 160px; height: 18px; border-radius: 9px; background: #2A1714; box-shadow: {{e.barEdge}}">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{e.pct}}; border-radius: 9px; background: {{e.fill}}"></div>
          <span style="position: absolute; inset: 0; text-align: center; font-size: 13px; line-height: 18px; font-weight: 700; color: #FFF6EE; text-shadow: 0 1px 2px #000">{{e.hp}}</span>
        </div>
        <div style="flex: none; width: 34px"></div>
      </div>
      <div style="margin-top: 10px; min-height: 32px; display: flex; gap: 8px; justify-content: center">
        <sc-for list="{{e.statuses}}" as="s" hint-placeholder-count="0">
          <div style="position: relative; width: 32px; height: 32px; border-radius: 8px; background: {{s.bg}}; border: 1px solid {{s.edge}}; display: grid; place-items: center; font-size: 15px; font-weight: 900; color: {{s.ink}}">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{s.f}}" style="fill: {{s.ink}}"></path><path d="{{s.s}}" style="fill: none; stroke: {{s.ink}}; stroke-width: 2.2; stroke-linecap: round"></path><path d="{{s.k}}" style="fill: none; stroke: {{s.bg}}; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
            <span style="position: absolute; right: -6px; bottom: -6px; min-width: 16px; height: 16px; padding: 0 3px; box-sizing: border-box; border-radius: 8px; background: #0D0708; border: 1px solid {{s.edge}}; font-size: 11px; line-height: 14px; text-align: center; color: #F3ECDD">{{s.n}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <!-- 手牌：与职业卡面同一套——厚涂插画窗 + 锻钢边 + 琥珀费用 -->
  <div style="position: absolute; left: 960px; top: 742px; width: 0; height: 0; z-index: 5">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <div style="{{c.pos}}">
        <div style="width: 206px; height: 290px; box-sizing: border-box; border-radius: 14px; padding: 3px; background: linear-gradient(160deg, {{c.edgeA}}, #3C302A 45%, {{c.edgeB}}); box-shadow: 0 18px 34px #000000A0">
          <div style="position: relative; width: 100%; height: 100%; border-radius: 11px; background: linear-gradient(180deg, #241B19, #170F0E); overflow: hidden; display: flex; flex-direction: column">
            <div style="position: relative; height: 128px; background: #170F0E">
              <img src="{{c.art}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: {{c.focus}}">
              <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #170F0E00 55%, #170F0EF0 100%)"></div>
            </div>
            <div style="margin-top: -18px; position: relative; text-align: center; font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 900; color: #F2ECDF; letter-spacing: 3px; text-shadow: 0 2px 6px #000">{{c.name}}</div>
            <div style="margin: 6px auto 0; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 4px; color: {{c.tag}}">
              <span style="width: 18px; height: 1px; background: {{c.tag}}"></span>{{c.type}}<span style="width: 18px; height: 1px; background: {{c.tag}}"></span>
            </div>
            <div style="flex: 1; padding: 6px 16px 14px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 16px; line-height: 1.55; color: #C9C3B6; white-space: pre-line">{{c.text}}</div>
            <div style="position: absolute; left: 4px; top: 4px; width: 44px; height: 44px; display: grid; place-items: center">
              <span style="position: absolute; width: 30px; height: 30px; transform: rotate(45deg); border-radius: 4px; background: linear-gradient(135deg, #FBE3A8, #D49A44 55%, #7E521C); box-shadow: 0 0 0 2px #170F0E, 0 0 0 3px #E9C77B, 0 0 12px #E9C77B88"></span>
              <span style="position: relative; font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 900; color: #2A1708">{{c.cost}}</span>
            </div>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 能量：铁座熔核 -->
  <div style="position: absolute; left: 96px; top: 800px; width: 128px; height: 128px; border-radius: 50%; background: #120B0A; box-shadow: 0 0 0 2px #6E5A42, 0 0 0 6px #1A1312, 0 0 0 7px #3E322A, 0 0 36px #E0602A55, 0 14px 30px #000000C0; display: grid; place-items: center">
    <div style="position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #FFE2A0 0%, #F09A3A 32%, #B83A1A 66%, #4A120A 100%); box-shadow: inset 0 -10px 18px #2A0806, inset 0 6px 10px #FFE6B055"></div>
    <span style="position: relative; font-family: 'Noto Serif SC', serif; font-size: 50px; font-weight: 900; line-height: 1; color: #FFF8EC; -webkit-text-stroke: 2px #3A0E06; paint-order: stroke fill; text-shadow: 0 2px 0 #3A0E06">3<span style="font-size: 24px; color: #FFE2B8">/3</span></span>
  </div>

  <!-- 抽牌堆 / 弃牌堆：叠放牌背 + 盾形计数 -->
  <button aria-label="抽牌堆 8 张" style="position: absolute; left: 66px; top: 962px; width: 120px; height: 96px; padding: 0; border: none; background: transparent">
    <span style="position: absolute; left: 22px; top: 14px; width: 52px; height: 72px; box-sizing: border-box; border-radius: 6px; background: linear-gradient(160deg, #4A2A22, #24140F); border: 1.5px solid #8C7454; transform: rotate(-12deg)"></span>
    <span style="position: absolute; left: 30px; top: 10px; width: 52px; height: 72px; box-sizing: border-box; border-radius: 6px; background: linear-gradient(160deg, #5A3328, #2A1712); border: 1.5px solid #B8975E; transform: rotate(-4deg); display: grid; place-items: center">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 12 12 21 5 12Z" fill="none" stroke="#E9C77B" stroke-width="1.6"></path><path d="M12 8 15.5 12 12 16 8.5 12Z" fill="#E9C77B"></path></svg>
    </span>
    <span style="position: absolute; left: 74px; top: 40px; width: 36px; height: 40px; display: grid; place-items: center">
      <svg width="36" height="40" viewBox="0 0 24 26" style="position: absolute" aria-hidden="true"><path d="M12 1 22 4.5v7.5c0 6-4.3 10.6-10 13-5.7-2.4-10-7-10-13V4.5Z" style="fill: #1A1312; stroke: #E9C77B; stroke-width: 1.4"></path></svg>
      <b style="position: relative; top: -2px; font-size: 17px; color: #F3ECDD">8</b>
    </span>
  </button>
  <button aria-label="弃牌堆 0 张" style="position: absolute; right: 66px; top: 962px; width: 120px; height: 96px; padding: 0; border: none; background: transparent">
    <span style="position: absolute; left: 38px; top: 10px; width: 52px; height: 72px; box-sizing: border-box; border-radius: 6px; background: linear-gradient(200deg, #3A2E2A, #1C1513); border: 1.5px dashed #6E5A42; transform: rotate(6deg); display: grid; place-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" stroke="#6E5A42" stroke-width="2" stroke-linecap="round"></path></svg>
    </span>
    <span style="position: absolute; left: 10px; top: 40px; width: 36px; height: 40px; display: grid; place-items: center">
      <svg width="36" height="40" viewBox="0 0 24 26" style="position: absolute" aria-hidden="true"><path d="M12 1 22 4.5v7.5c0 6-4.3 10.6-10 13-5.7-2.4-10-7-10-13V4.5Z" style="fill: #1A1312; stroke: #8C7454; stroke-width: 1.4"></path></svg>
      <b style="position: relative; top: -2px; font-size: 17px; color: #BBAA8C">0</b>
    </span>
  </button>

  <!-- 结束回合：剑形铭牌 -->
  <button style="position: absolute; right: 56px; top: 846px; width: 270px; height: 84px; padding: 0; border: none; background: transparent; filter: drop-shadow(0 0 18px #E9C77B55) drop-shadow(0 10px 18px #000000A0)">
    <span style="position: absolute; inset: 0; clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%); background: #E9C77B"></span>
    <span style="position: absolute; inset: 3px; clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%); background: linear-gradient(180deg, #FAF4E6 0%, #E8DCC2 60%, #CDBB98 100%)"></span>
    <span style="position: absolute; left: 36px; right: 36px; top: 12px; height: 1px; background: #B8975E80"></span>
    <span style="position: absolute; left: 36px; right: 36px; bottom: 12px; height: 1px; background: #B8975E80"></span>
    <span style="position: relative; display: grid; place-items: center; height: 100%; color: #3B2A1E; font-family: 'Noto Serif SC', serif; font-size: 26px; font-weight: 900; letter-spacing: 10px; padding-left: 10px">结束回合</span>
  </button>

  <!-- 药水弹层：三行讲清 -->
  <sc-if value="{{isPotion}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; z-index: 20; left: 271px; top: 90px; width: 360px; box-sizing: border-box; padding: 18px 20px; border-radius: 14px; background: #1F1716F5; border: 1px solid #8C7454; box-shadow: inset 0 1px 0 #FFFFFF12, 0 24px 56px #000000B8">
      <div style="position: absolute; left: 172px; top: -8px; width: 14px; height: 14px; background: #1F1716; border-left: 1px solid #8C7454; border-top: 1px solid #8C7454; transform: rotate(45deg)"></div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 20px; font-weight: 900">火焰药水</span>
        <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #3E2620; border: 1px solid #8A4A3A; color: #F2A684; font-size: 13px; font-weight: 700; line-height: 24px">单体</span>
      </div>
      <div style="margin-top: 10px; font-size: 17px; color: #C9C3B6">造成 <b style="color: #FFFFFF">20</b> 伤害</div>
      <div style="margin-top: 16px; display: flex; gap: 10px">
        <button style="flex: 1; height: 48px; border-radius: 24px; border: 2px solid #E9C77B; background: linear-gradient(180deg, #F6F0E2, #E2D6BE); color: #3B4255; font-size: 17px; font-weight: 900; letter-spacing: 4px">使用</button>
        <button style="width: 88px; height: 48px; border-radius: 12px; border: 1px solid #6E5A42; background: transparent; color: #BBAA8C; font-size: 15px">丢弃</button>
      </div>
    </div>
  </sc-if>

  <!-- 药水瞄准 -->
  <sc-if value="{{isTarget}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; z-index: 6; inset: 0; background: #05030366"></div>
    <svg width="1920" height="1080" style="position: absolute; z-index: 20; left: 0; top: 0; pointer-events: none" aria-hidden="true">
