<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>操作说明</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@600;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0D0708; font-family: 'Noto Sans SC', sans-serif; color: #F3ECDD">
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 1100px 900px at 50% 40%, #4E1A1A 0%, #2A1013 45%, #0D0708 100%)"></div>
  <div style="position: absolute; inset: 0; background: #050303B3"></div>

  <div style="position: absolute; left: 260px; top: 110px; width: 1400px; height: 860px; border-radius: 18px; background: linear-gradient(180deg, #2A201D, #17110F); border: 1px solid #6E5A42; box-shadow: inset 0 0 0 6px #120C0B, inset 0 0 0 7px #4A3C2C, 0 30px 80px #000000C0"></div>

  <div style="position: absolute; left: 330px; top: 158px; width: 1260px; display: flex; justify-content: space-between; align-items: center">
    <div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: 6px; color: #BBAA8C"><span style="width: 32px; height: 1px; background: #E9C77B"></span>菜单</div>
      <div style="margin-top: 8px; font-family: 'Noto Serif SC', serif; font-size: 48px; font-weight: 900; color: #F6DFA4">操作说明</div>
    </div>
    <div style="width: 48px; height: 48px; border-radius: 50%; background: #1A1312; border: 1px solid #6E5A42; display: grid; place-items: center">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19" style="fill: none; stroke: #E9C77B; stroke-width: 2.6; stroke-linecap: round"></path></svg>
    </div>
  </div>

  <!-- 手势卡片 -->
  <div style="position: absolute; left: 330px; top: 290px; width: 1260px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">
    <sc-for list="{{tips}}" as="t" hint-placeholder-count="6">
      <div style="display: flex; gap: 18px; padding: 20px; border-radius: 14px; background: #1E1716; border: 1px solid #3E322A">
        <div style="flex: none; width: 96px; height: 96px; border-radius: 12px; background: #120C0B; border: 1px solid #3E322A; display: grid; place-items: center">
          <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
            <path d="{{t.a}}" style="fill: #3E322A; stroke: #8C7454; stroke-width: 1.5"></path>
            <path d="{{t.b}}" style="fill: none; stroke: #E9C77B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: {{t.dash}}"></path>
            <path d="{{t.c}}" style="fill: #E9C77B"></path>
            <text x="38" y="43" text-anchor="middle" style="font-size: 12px; font-weight: 900; fill: #F6DFA4; letter-spacing: 1px">{{t.lbl}}</text>
          </svg>
        </div>
        <div style="min-width: 0">
          <b style="font-size: 20px">{{t.title}}</b>
          <div style="margin-top: 6px; font-size: 15px; line-height: 1.6; color: #BBAA8C">{{t.body}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- 快捷键 -->
  <div style="position: absolute; left: 330px; top: 720px; width: 1260px">
    <div style="font-size: 14px; letter-spacing: 4px; color: #9E8C72; padding-bottom: 12px; border-bottom: 1px solid #3E322A">键盘（电脑）</div>
    <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 40px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 14px">
          <span style="min-width: 44px; height: 40px; padding: 0 12px; box-sizing: border-box; border-radius: 8px; background: linear-gradient(180deg, #3A2E28, #241B19); border: 1px solid #6E5A42; box-shadow: 0 3px 0 #0D0708; display: grid; place-items: center; font-size: 16px; font-weight: 900; color: #F6DFA4">{{k.key}}</span>
          <span style="font-size: 17px; color: #E6DCC8">{{k.does}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const card = 'M8 34h20v32H8Z';
    const foe = 'M52 8a12 12 0 1 1 0 24 12 12 0 0 1 0-24Z';
    const tips = [
      { title: '出牌', body: '把牌拖到敌人身上松手；不需要目标的牌，拖出手牌区即可。', a: card + ' ' + foe, b: 'M18 34C20 18 34 14 44 20', c: 'M44 14l6 8-10 2Z', dash: 'none', lbl: '' },
      { title: '取消', body: '拖回手牌区松手。', a: card, b: 'M60 20C50 10 30 14 22 30', c: 'M16 26l6 10 6-8Z', dash: '5 5', lbl: '' },
      { title: '看详情', body: '悬停（手机上按住）牌、敌人或主角，一次看全部状态和说明。', a: card + ' ' + foe, b: '', c: 'M48 40l4 22 5-7 8 9 4-3-8-9 8-3Z', dash: 'none', lbl: '' },
      { title: '用药水', body: '点顶栏药水看效果。伤害、中毒类拖到一个敌人身上；其余点「使用」，作用于自己。', a: 'M30 10h16v8l8 14v30H22V32l8-14Z', b: '', c: 'M30 40h16v18H30Z', dash: 'none', lbl: '' },
      { title: '读意图', body: '敌人头顶是它下回合的行动，数字是最终伤害；悬停意图可看算式。', a: foe, b: '', c: 'M40 44l14-14 3 3-14 14Z M34 50l6 6M30 58l4-4', dash: 'none', lbl: '' },
      { title: '结束回合', body: '出完牌点右下角「结束回合」，敌人随即行动。', a: 'M2 38 12 28h52l10 10-10 10H12Z', b: '', c: '', dash: 'none', lbl: '结束回合' }
    ];
    const keys = [
      { key: 'E', does: '结束回合' }, { key: '1–9', does: '选中第几张牌' }, { key: 'M', does: '查看地图' },
      { key: 'D', does: '查看牌组' }, { key: 'Esc', does: '打开菜单 / 取消' }, { key: 'Tab', does: '切换目标敌人' }
    ];
    return { tips, keys };
  }
}
</script>
</body>
</html>
