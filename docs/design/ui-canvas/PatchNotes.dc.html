<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>更新公告</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@600;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0D0708; font-family: 'Noto Sans SC', sans-serif; color: #F3ECDD">
  <!-- 主菜单背景压暗 -->
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 1100px 900px at 50% 40%, #4E1A1A 0%, #2A1013 45%, #0D0708 100%)"></div>
  <div style="position: absolute; inset: 0; background: #050303B3"></div>

  <!-- 面板 -->
  <div style="position: absolute; left: 260px; top: 110px; width: 1400px; height: 860px; border-radius: 18px; background: linear-gradient(180deg, #2A201D, #17110F); border: 1px solid #6E5A42; box-shadow: inset 0 0 0 6px #120C0B, inset 0 0 0 7px #4A3C2C, inset 0 1px 0 #FFFFFF10, 0 30px 80px #000000C0"></div>
  <!-- 四角岩晶 -->
  <sc-for list="{{corners}}" as="c" hint-placeholder-count="4">
    <svg style="{{c}}" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 1 25 13 13 25 1 13Z" style="fill: #1A1312; stroke: #E9C77B; stroke-width: 1.6"></path><path d="M13 7 19 13 13 19 7 13Z" style="fill: #E9C77B"></path></svg>
  </sc-for>

  <!-- 页眉 -->
  <div style="position: absolute; left: 330px; top: 160px; width: 1260px; display: flex; align-items: flex-end; justify-content: space-between">
    <div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: 6px; color: #BBAA8C">
        <span style="width: 32px; height: 1px; background: #E9C77B"></span>更新公告
      </div>
      <div style="margin-top: 10px; display: flex; align-items: baseline; gap: 22px">
        <span style="font-family: 'Noto Serif SC', serif; font-size: 64px; font-weight: 900; line-height: 1; color: #F6DFA4; text-shadow: 0 0 24px #E9C77B40">v0.10.1</span>
        <span style="font-size: 18px; color: #BBAA8C">2026.10.27</span>
        <span style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1px solid #E9C77B; color: #F6DFA4; font-size: 14px; font-weight: 700; line-height: 24px">最新</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 18px">
      <div style="width: 48px; height: 48px; border-radius: 50%; background: #1A1312; border: 1px solid #6E5A42; display: grid; place-items: center">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19" style="fill: none; stroke: #E9C77B; stroke-width: 2.6; stroke-linecap: round"></path></svg>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 330px; top: 262px; width: 1260px; height: 1px; background: linear-gradient(90deg, #6E5A42, #6E5A4200)"></div>

  <!-- 左：版本列表 -->
  <div style="position: absolute; left: 330px; top: 292px; width: 260px; height: 620px; overflow: hidden">
    <div style="position: absolute; left: 11px; top: 14px; bottom: 0; width: 1px; background: #3E322A"></div>
    <sc-for list="{{versions}}" as="v" hint-placeholder-count="10">
      <div style="{{v.row}}">
        <span style="{{v.dot}}"></span>
        <div>
          <div style="{{v.name}}">{{v.ver}}</div>
          <div style="font-size: 13px; color: #6E5A42; margin-top: 2px">{{v.date}}</div>
        </div>
      </div>
    </sc-for>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(180deg, #17110F00, #17110F)"></div>
  </div>

  <!-- 右：内容 -->
  <div style="position: absolute; left: 650px; top: 292px; width: 940px; height: 620px; display: flex; flex-direction: column; gap: 30px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section>
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 34px; height: 34px; border-radius: 9px; background: {{g.bg}}; border: 1px solid {{g.edge}}; display: grid; place-items: center">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{g.icon}}" style="fill: none; stroke: {{g.ink}}; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"></path></svg>
          </span>
          <b style="font-size: 22px; color: {{g.ink}}">{{g.title}}</b>
          <span style="font-size: 15px; color: #6E5A42">{{g.count}}</span>
        </div>
        <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
            <div style="display: flex; gap: 14px; align-items: baseline; padding-left: 12px">
              <span style="flex: none; width: 7px; height: 7px; transform: rotate(45deg) translateY(-3px); background: {{g.ink}}"></span>
              <span style="font-size: 19px; line-height: 1.6; color: #E6DCC8">{{it}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const corners = [[247, 97], [1647, 97], [247, 957], [1647, 957]].map(([x, y]) => 'position: absolute; left: ' + x + 'px; top: ' + y + 'px');
    const list = [['v0.10.1', '10.27'], ['v0.10.0', '10.26'], ['v0.9.4', '10.25'], ['v0.9.3', '10.24'], ['v0.9.2', '10.23'], ['v0.9.1', '10.22'], ['v0.9.0', '10.21'], ['v0.8.2', '10.19'], ['v0.8.1', '10.18'], ['v0.8.0', '10.16']];
    const versions = list.map(([ver, date], i) => {
      const on = i === 0;
      return {
        ver, date,
        row: 'position: relative; display: flex; gap: 18px; align-items: flex-start; height: 62px; padding-left: 2px',
        dot: 'flex: none; margin-top: 6px; width: ' + (on ? 18 : 10) + 'px; height: ' + (on ? 18 : 10) + 'px; margin-left: ' + (on ? 0 : 4) + 'px; transform: rotate(45deg); background: ' + (on ? '#E9C77B' : '#3E322A') + '; box-shadow: ' + (on ? '0 0 12px #E9C77B' : 'none'),
        name: 'font-size: ' + (on ? 22 : 18) + 'px; font-weight: ' + (on ? 900 : 500) + '; color: ' + (on ? '#F6DFA4' : '#9E8C72') + '; font-variant-numeric: tabular-nums'
      };
    });
    const groups = [
      { title: '新增', count: '2', bg: '#3E2C18', edge: '#B8975E', ink: '#F0C878', icon: 'M12 5v14M5 12h14', items: ['卡牌说明里的数值会随力量、虚弱等变色，并标出增减', '角色与怪物补齐行动音效、打击声和房间反馈'] },
      { title: '调整', count: '1', bg: '#1E3442', edge: '#4E7E9C', ink: '#A8D6F0', icon: 'M4 8h11M4 16h7M15 5v6M11 13v6M15 8h5M11 16h9', items: ['药水需要先选目标再确认使用；状态都有效果说明'] },
      { title: '修复', count: '2', bg: '#40221C', edge: '#9A4636', ink: '#F2A684', icon: 'M14.5 6.5a4 4 0 0 0-5 5L4 17l3 3 5.5-5.5a4 4 0 0 0 5-5l-2.5 2.5-2.5-.5-.5-2.5Z', items: ['撕裂（Rupture）的触发顺序', '复活前的掉血结算顺序'] }
    ];
    return { corners, versions, groups };
  }
}
</script>
</body>
</html>
