<title>杀戮原塔2 界面原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：页面外壳是工作台（左说明、右画布），画布是 1280x720 的游戏界面，只用千星客户端控件能画出的形状（纯色矩形、圆、图库图标、文字、填充条）。 */
:root{
  color-scheme:dark;
  /* 与 data/presentation/ui_theme.json 同值 */
  --backdrop:#0F1117;--panel:#1C1E27;--raised:#272A36;--sunken:#13141B;--line:#3B3E4C;
  --gold:#E3B866;--gold-hi:#F5D79A;--gold-dim:#8E7448;--geo:#F0B850;--geo-deep:#A8732A;
  --text:#ECE6DA;--text-dim:#A9A595;--muted:#6E6C66;
  --hp:#D2524A;--hp-ghost:#F3E2C8;--hp-track:#3A1F22;--block:#5FA8E8;--energy:#E9A93B;--energy-empty:#4A3E2A;
  --good:#7DC77A;--danger:#E5574B;--buff:#E6A24A;--debuff:#A77BE0;
  --t-attack:#B9483F;--t-skill:#3F7FB9;--t-power:#B98A35;--t-status:#5C5F6B;--t-curse:var(--t-status);
  --r-basic:#8A8F9C;--r-common:#5F8FD6;--r-uncommon:#A974E0;--r-rare:#E0A243;--r-curse:var(--line);
  --shell:#0A0B10;--shell-fg:#C9C4B6;
  --f-game:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--shell);color:var(--shell-fg);font-family:var(--f-game);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
button{font-family:inherit}
.bench{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:1500px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-weight:900;font-size:18px;color:var(--gold-hi);letter-spacing:.04em;margin-right:auto}
.brand small{display:block;font:400 11px var(--f-mono);color:var(--muted);letter-spacing:.08em}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--text-dim);padding:7px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--gold-hi)}
.seg button:focus-visible,.tog:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.tog{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text-dim);cursor:pointer}
.label{font:600 10px var(--f-mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.frame{position:relative;width:100%;background:#000;border:1px solid var(--line);overflow:hidden}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.note{background:var(--panel);border:1px solid var(--line);padding:12px 14px;min-width:0}
.note h3{margin:0 0 6px;font-size:13px;color:var(--gold-hi)}
.note ul{margin:0;padding-left:18px;line-height:1.7;color:var(--text-dim)}
.note code{font:12px var(--f-mono);color:var(--gold)}

/* ===== 游戏画布：所有坐标都按 1280x720 ===== */
.cv{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--backdrop);color:var(--text);font-family:var(--f-game);overflow:hidden;user-select:none}
.cv *{position:absolute}
.cv .flow,.cv .flow *{position:static}
.r{background:var(--panel)}
.disc{border-radius:50%}
.t{white-space:nowrap;line-height:1.2}
.ico{display:block}
.ico svg{position:static;width:100%;height:100%;display:block}
.num{font-weight:900;font-variant-numeric:tabular-nums}
.hit{cursor:pointer}
.annot .ann{outline:1px dashed rgba(240,184,80,.55)}
.annot .ann::after{content:attr(data-k);position:absolute;left:0;top:-14px;font:600 9px/1 var(--f-mono);color:#111;background:var(--geo);padding:2px 3px;white-space:nowrap;z-index:99;pointer-events:none}
.safe{left:40px;top:20px;width:1200px;height:680px;border:1px dashed rgba(125,199,122,.8);pointer-events:none;z-index:200}
.touchzone{background:repeating-linear-gradient(45deg,rgba(229,87,75,.18) 0 8px,transparent 8px 16px);border:1px dashed rgba(229,87,75,.7);pointer-events:none;z-index:199}
.touchzone span{left:6px;top:4px;font:600 10px var(--f-mono);color:#ffb0a8}

/* 场景底：深岩层 + 岩元素微光（平台上=全屏纯色矩形 + 106056 柔光图片染色） */
.bgglow{border-radius:50%;background:radial-gradient(closest-side,rgba(240,184,80,.16),transparent);pointer-events:none}
.ground{left:0;top:388px;width:1280px;height:2px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent)}

/* 顶栏 */
.top{left:0;top:0;width:1280px;height:52px;background:var(--sunken);border-bottom:1px solid var(--gold-dim)}

/* 卡牌 */
.card{touch-action:none;width:148px;height:208px;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s,filter .2s;transform-origin:50% 100%}
.card .fr{inset:0;border:2px solid var(--rc);background:var(--panel)}
.card .nb{left:2px;top:2px;width:144px;height:30px;background:var(--raised)}
.card .nm{left:0;top:6px;width:148px;text-align:center;font-weight:700;font-size:17px;color:var(--text)}
.card .art{left:2px;top:32px;width:144px;height:64px;background:color-mix(in srgb,var(--tc) 32%,var(--panel))}
.card .art .ico{left:52px;top:12px;width:40px;height:40px;color:color-mix(in srgb,var(--tc) 45%,#fff)}
.card .tl{left:2px;top:96px;width:144px;height:18px;background:var(--sunken);font-size:12px;color:var(--text-dim);text-align:center;line-height:18px;letter-spacing:.3em}
.card .tx{left:8px;top:118px;width:132px;height:84px;font-size:15px;line-height:1.38;white-space:normal;color:var(--text);display:flex;align-items:center;justify-content:center;text-align:center}
.card .tx span,.card .tx b{position:static}.card .tx b{color:var(--gold-hi)}
.card .cost{left:-10px;top:-10px;width:40px;height:40px;border-radius:50%;background:var(--energy);box-shadow:0 0 0 2px var(--backdrop),0 0 0 3px var(--gold-hi);color:#2a1d08;font-size:22px;text-align:center;line-height:40px}
.card.up .nm{color:var(--good)}
.card.cant .cost{background:var(--energy-empty);color:var(--danger)}
.card.cant{filter:saturate(.35) brightness(.7)}
.card.sel{z-index:50}
.card.sel .fr{box-shadow:0 0 0 2px var(--gold-hi),0 0 22px rgba(245,215,154,.45)}

/* 战斗单位 */
.unit .plate{border:2px solid var(--line);background:var(--raised)}
.unit .mono{inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--text-dim)}
.unit.target .plate{border-color:var(--gold-hi);box-shadow:0 0 18px rgba(245,215,154,.5)}
.unit.dead{opacity:0;transition:opacity .35s}
.hpbar{background:var(--hp-track);border:1px solid #000}
.hpbar .g{left:0;top:0;height:100%;background:var(--hp-ghost);transition:width .45s .25s}
.hpbar .f{left:0;top:0;height:100%;background:var(--hp);transition:width .2s}
.hpbar.shield{border-color:var(--block)}
.hpbar.shield .f{background:#4F86BD}
.hpbar .v{left:0;top:-1px;width:100%;text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 2px #000}
.blk{width:34px;height:34px}
.blk .ico{inset:0;color:var(--block)}
.blk .v{inset:0;text-align:center;line-height:34px;font-size:14px;font-weight:900;color:#0c1a28}
.st{width:26px;height:26px}
.st .ico{inset:2px;color:var(--c)}
.st .v{right:-3px;bottom:-4px;font-size:12px;font-weight:900;text-shadow:0 1px 2px #000,0 0 2px #000}
.intent{display:flex}
.intent .ico{position:relative;width:40px;height:40px}
.intent .v{position:relative;font-size:22px;font-weight:900;margin-left:2px;line-height:40px;text-shadow:0 2px 3px #000}
.pop{font-size:34px;font-weight:900;pointer-events:none;text-shadow:0 2px 0 #000,0 0 6px #000;z-index:120}

/* 按钮四态（平台 presetButton：normal/hover/pressed/disabled 各一个子控件） */
.btn{border:2px solid var(--gold);background:var(--raised);color:var(--gold-hi);font-weight:700;text-align:center;cursor:pointer;transition:background .12s,transform .12s}
.btn:hover{background:#353949}
.btn:active{transform:scale(.96);background:var(--gold-dim);color:#fff}
.btn.pri{background:var(--geo);color:#2a1d08;border-color:var(--gold-hi)}
.btn.pri:hover{background:var(--gold-hi)}
.btn.off{border-color:var(--line);color:var(--muted);background:var(--sunken);cursor:default;transform:none}
.banner{left:0;top:300px;width:1280px;height:84px;background:linear-gradient(90deg,transparent,rgba(15,17,23,.92) 25%,rgba(15,17,23,.92) 75%,transparent);border-top:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);z-index:150;pointer-events:none;opacity:0}
.banner .t{left:0;width:1280px;top:20px;text-align:center;font-size:36px;font-weight:900;color:var(--gold-hi);letter-spacing:.3em}
.veil{inset:0;background:rgba(15,17,23,.8);z-index:160}
.modal{background:var(--panel);border:2px solid var(--gold-dim);box-shadow:0 0 0 1px #000}
.tip{background:var(--sunken);border:1px solid var(--gold-dim);padding:8px 10px;font-size:14px;line-height:1.5;white-space:normal;z-index:180;pointer-events:none;color:var(--text)}
.tip b{position:static;color:var(--gold-hi)}
.mapnode{border-radius:50%;transition:transform .2s}
.mapnode.reach{cursor:pointer;animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.mapnode.reach{animation:none}.card,.hpbar .f,.hpbar .g{transition:none}}
</style>

/* 拖牌与点选：按住拖出 8px 后卡牌跟手，按水平速度倾斜；

let drag=null,dragJustEnded=false;
function cvPoint(e){const r=cv.getBoundingClientRect(),k=r.width/1280;return[(e.clientX-r.left)/k,(e.clientY-r.top)/k]}
function foeAt(x,y){return B.foes.findIndex((f,j)=>{if(f.hp<=0)return false;const u=document.getElementById('u-'+j);const l=parseFloat(u.style.left),t=parseFloat(u.style.top),w=parseFloat(u.style.width),h=parseFloat(u.style.height);return x>l-20&&x<l+w+20&&y>t-60&&y<t+h+40})}

function bindPlayArea(area){
  let held=null,released=null;
  area.onpointerdown=e=>{held=released=null;if(B.busy||drag||B.sel<0)return;const[x,y]=cvPoint(e);held={id:e.pointerId,x,y,index:B.sel,card:B.hand[B.sel]}};
  area.onpointermove=e=>{if(!held||held.id!==e.pointerId)return;const[x,y]=cvPoint(e);if(Math.hypot(x-held.x,y-held.y)>=8)held=null};
  area.onpointercancel=e=>{if(held?.id===e.pointerId)held=null;if(released?.id===e.pointerId)released=null};
  area.onpointerup=e=>{if(!held||held.id!==e.pointerId)return;const h=held;held=null;const[x,y]=cvPoint(e);released=playFieldContains(x,y)&&Math.hypot(x-h.x,y-h.y)<8?h:null};
  area.onclick=e=>{e.stopPropagation();const h=released;if(!h||h.id!==e.pointerId)return;released=null;if(!dragJustEnded&&h.index===B.sel&&h.card===B.hand[B.sel])play(B.sel,null)};
}
function dragStart(e,el,i,rot,drop){
  if(drag||B.busy||!playable(B.hand[i]))return;
  const[x,y]=cvPoint(e);drag={el,i,card:B.hand[i],pointer:e.pointerId,rot,drop,l0:el.style.left,t0:el.style.top,x0:x,y0:y,x,y,t:performance.now(),vx:0,vy:0,on:false,foe:-1};

function dragMove(e){

  drag.vx=drag.vx*.6+(x-drag.x)/dt*.4;drag.vy=drag.vy*.6+(y-drag.y)/dt*.4;drag.x=x;drag.y=y;drag.t=now;
  if(!drag.on&&Math.hypot(x-drag.x0,y-drag.y0)<8)return;
  if(!drag.on){drag.on=true;B.sel=-1;drag.el.style.transition='none';drag.el.style.zIndex=90;drag.el.classList.add('sel')}
  const tilt=Math.max(-14,Math.min(14,drag.vx*18));
  drag.el.style.left=(x-74)+'px';drag.el.style.top=(y-104)+'px';drag.el.style.transform=`rotate(${tilt}deg) scale(1.1)`;
  const card=B.hand[drag.i],f=needsTarget(card)?foeAt(x,y):-1;
  if(f!==drag.foe){drag.foe=f;B.foes.forEach((_,j)=>document.getElementById('u-'+j).classList.toggle('target',j===f))}
  const line=document.getElementById('playline');if(line)line.style.opacity=needsTarget(card)?0:playFieldContains(x,y)?1:.35;
}
function dragEnd(e){
  if(!drag||e.pointerId!==drag.pointer)return;
  if(e.type!=="pointercancel")dragMove(e);const d=drag;drag=null;d.el.onpointermove=d.el.onpointerup=d.el.onpointercancel=null;
  if(!d.on)return;dragJustEnded=true;setTimeout(()=>dragJustEnded=false,0);
  const card=B.hand[d.i],cancelled=e.type==="pointercancel"||card!==d.card;
  let target=null,go=false;

/* ---------- 结算 ---------- */
function renderResult(win){
  backdrop();
  cv.append($(`<div class="bgglow" style="left:240px;top:-80px;width:800px;height:600px;opacity:${win?2:.6}"></div>`));
  cv.append(icon(580,70,120,win?'geo':'skull',win?'var(--geo)':'var(--danger)'));
  cv.append(text(0,206,win?'深渊已被封印':'旅途在此中断',{fs:40,w:1280,align:'center',bold:true,c:win?'var(--gold-hi)':'var(--text)'}));
  cv.append(text(0,262,win?'旅行者击败了深渊守卫，第一幕通关':`倒在第 ${RUN.floor} 层`,{fs:18,w:1280,align:'center',c:'var(--text-dim)'}));
  const stats=[['抵达层数',win?'15 / 15':`${RUN.floor} / 15`],['击败敌人',win?'23':'9'],['获得金币',win?'412':'131'],['卡组张数',RUN.deck.length]];
  stats.forEach(([k,v],i)=>{const x=280+i*184;cv.append($(`<div style="left:${x}px;top:320px;width:168px;height:110px;background:var(--panel);border:1px solid var(--line)"></div>`));cv.append(text(x,338,k,{fs:15,w:168,align:'center',c:'var(--muted)'}));cv.append(text(x,370,v,{fs:34,w:168,align:'center',bold:true}))});
  const again=btn(420,480,200,60,'再来一局',{pri:true});again.onclick=()=>{RUN.hp=62;go('map')};cv.append(again);
  const out=btn(660,480,200,60,'结束并结算');out.onclick=()=>pop(760,460,'交给平台结算界面','var(--gold-hi)');cv.append(out);
  cv.append(text(0,580,'「结束并结算」由节点图调用平台 settleStage，之后显示官方胜利 / 失败界面。',{fs:14,w:1280,align:'center',c:'var(--muted)'}));
  overlays();
}

}
const SCREENS=[['battle','战斗'],['map','地图'],['reward','奖励'],['pick','选牌'],['camp','营地'],['shop','商店'],['event','事件'],['treasure','宝箱'],['elite','精英'],['boss','首领'],['win','通关'],['lose','失败']];

  treasure:[['宝箱',['点击打开，宝箱弹一下，光晕变亮','显示遗物，点「拿取并离开」']]],

let screen='battle';
function go(s){
  screen=s;hideTip();
  if(s==='reward')rewardState=rewardState&&rewardState.fresh===false?rewardState:{gold:false,potion:false,card:false,fresh:false};
  if(['battle','elite','boss'].includes(s)){rewardState=null;newBattle(s==='battle'?'normal':s);renderBattle()}
  else ({map:renderMap,reward:()=>{rewardState=rewardState||{gold:false,potion:false,card:false,fresh:false};renderReward()},pick:renderPick,camp:renderCamp,shop:renderShop,event:renderEvent,treasure:renderTreasure,win:()=>renderResult(true),lose:()=>renderResult(false)})[s]();
  document.querySelectorAll('#screens button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===s||(s==='pick'&&b.dataset.s==='pick')));
  const n=document.getElementById('notes');n.innerHTML='';
  (NOTES[s]||[]).forEach(([h,items])=>n.append($(`<div class="note"><h3>${h}</h3><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`)));
}
const sc=document.getElementById('screens');SCREENS.forEach(([k,n])=>{const b=$(`<button type="button" data-s="${k}">${n}</button>`);b.onclick=()=>go(k);sc.append(b)});

['optSafe','optTouch','optAnn'].forEach(id=>document.getElementById(id).onchange=()=>go(screen));
layout();go('battle');
