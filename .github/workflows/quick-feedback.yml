name: Quick feedback
on:
  pull_request:
    branches: [develop, master]
permissions:
  contents: read
concurrency:
  group: quick-feedback-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  related:
    name: Advisory related tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/quality.yml
      - run: python3 -m pip install --disable-pip-version-check --retries 0 --timeout 30 Pillow==12.3.0
      - name: Verify exact PR merge and comparison base
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git -c credential.helper= -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --depth=1 --no-auto-maintenance --no-tags origin "$BASE_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
      - name: Quick related subset; complete Quality runs independently
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_LFS_TOKEN: ${{ github.token }}
          ABYSS_PYTHON: python3
        run: node scripts/test-affected.mjs --ci-fast --base "$BASE_SHA"
