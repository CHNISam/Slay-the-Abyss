name: Licenses
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - name: Materialize reviewed PNGs for the license audit
        timeout-minutes: 2
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: node scripts/ci-reviewed-lfs.mjs
      - run: node --test scripts/check-license.test.mjs
      - run: node scripts/check-license.mjs
