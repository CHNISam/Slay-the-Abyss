name: Quality
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ownership:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feat/'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify live remote execution authorization for exact PR head
        env:
          CLAIM_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CLAIM_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLAIM_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CLAIM_TOKEN" | base64 -w0)"
          unset CLAIM_TOKEN
          node scripts/remote-task-claim.mjs verify-pr --branch "$CLAIM_BRANCH" --sha "$CLAIM_SHA"
  check:
    needs: ownership
    if: ${{ !cancelled() && (needs.ownership.result == 'success' || needs.ownership.result == 'skipped') }}
    concurrency:
      group: slay-the-abyss-full-quality
      cancel-in-progress: false
      queue: max
    # Fork code stays on GitHub-hosted infrastructure.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Windows", "X64", "slay-the-abyss"]') }}
    # Run 40141217243 exhausted 20 minutes after JS passed and only 123 of
    # 207 Lua fixtures had run on Node 22. Keep every fixture and its own
    # timeout; this bound allows the complete serial suite to finish.
    # The previous complete run took almost 45 minutes. Added protocol,
    # inventory and engineering checks retain every per-fixture deadline.
    timeout-minutes: 75
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'pwsh -NoProfile -File {0}' || 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}' }}
    steps:
      - name: Check out exact revision with installed Git
        env:
          CI_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Location).Path -ne $env:GITHUB_WORKSPACE) { throw 'Unexpected checkout directory' }
          if ($env:CI_SHA -cnotmatch '\A[0-9a-fA-F]{40}\z') { throw 'Invalid checkout SHA' }
          if ($env:CI_REF -cnotmatch '^refs/((heads|tags)/.+|pull/[1-9][0-9]*/merge)$') { throw 'Invalid checkout ref' }
          git check-ref-format $env:CI_REF
          if ($LASTEXITCODE -ne 0) { throw 'Invalid checkout ref' }
          # Hash the validated identity: branch names stay data, never shell/ref paths.
          $refHasher = [Security.Cryptography.SHA256]::Create()
          try { $refHash = $refHasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($env:CI_REF)) } finally { $refHasher.Dispose() }
          $checkoutRef = 'refs/ci/quality-tips/' + [BitConverter]::ToString($refHash).Replace('-', '').ToLowerInvariant()
          git init .
          if ($LASTEXITCODE -ne 0) { throw 'Git initialization failed' }
          if (@(git remote) -contains 'origin') {
            git remote set-url origin "https://github.com/$env:CI_REPOSITORY.git"
          } else {
            git remote add origin "https://github.com/$env:CI_REPOSITORY.git"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Remote setup failed' }
          $previousHead = git rev-parse --verify --quiet HEAD
          if ($LASTEXITCODE -eq 0) {
            git update-ref refs/ci/previous $previousHead
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve previous checkout' }
          }
          function Get-PackBytes {
            $total = (Get-ChildItem -LiteralPath '.git/objects/pack' -Filter '*.pack' -File | Measure-Object -Property Length -Sum).Sum
            if ($null -eq $total) { return [long]0 }
            return [long]$total
          }
          $packBytesBefore = Get-PackBytes
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CI_TOKEN"))
          try {
            git -c credential.helper= -c fetch.unpackLimit=1 fetch --no-auto-maintenance --force --no-tags origin "+${env:CI_SHA}:refs/ci/current"
            if ($LASTEXITCODE -ne 0) { throw 'Git fetch failed' }
          } finally {
            Remove-Item Env:\GIT_CONFIG_COUNT, Env:\GIT_CONFIG_KEY_0, Env:\GIT_CONFIG_VALUE_0, Env:\CI_TOKEN
          }
          # Keep each PR/branch reachable across A -> B -> A fetch negotiation.
          git update-ref --no-deref $checkoutRef refs/ci/current
          if ($LASTEXITCODE -ne 0) { throw 'Could not preserve branch checkout' }
          # A bounded local cache, not a network budget: retain this tip plus the
          # 63 newest other tips by commit time. Evicted branches can download again.
          $maxCheckoutTips = 64
          $checkoutTips = @(git for-each-ref --sort=refname --sort=-committerdate --format='%(refname)' refs/ci/quality-tips/)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list checkout tips' }
          foreach ($staleRef in @($checkoutTips | Where-Object { $_ -cmatch '^refs/ci/quality-tips/[0-9a-f]{64}$' -and $_ -cne $checkoutRef } | Select-Object -Skip ($maxCheckoutTips - 1))) {
            git update-ref --no-deref -d $staleRef
            if ($LASTEXITCODE -ne 0) { throw 'Could not retire old checkout tip' }
          }
          $receivedPackBytes = (Get-PackBytes) - $packBytesBefore
          Write-Output "Checkout new Git pack payload: $receivedPackBytes bytes"
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Checkout new Git pack payload: $receivedPackBytes bytes" }
          if ($receivedPackBytes -lt 0) { throw 'Git pack accounting changed unexpectedly' }
          if ($receivedPackBytes -gt 128MB) { throw 'Checkout exceeded 128 MiB; investigate before retrying' }
          if ($receivedPackBytes -gt 32MB) { Write-Output '::warning::Checkout received over 32 MiB; check whether this is an expected first download' }
          git checkout --force --detach refs/ci/current
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          if ((git rev-parse HEAD) -ne $env:CI_SHA) { throw 'Revision mismatch' }
          git clean -ffd
          if ($LASTEXITCODE -ne 0) { throw 'Workspace cleanup failed' }
      # Both Windows runners must use the measured runtime, rather than their
      # different global Node installations. Keep every test and its budget.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Verify Node baseline
        run: node -e "if (process.versions.node !== '24.18.0') throw new Error('Quality requires Node 24.18.0'); console.log(process.version)"
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            git diff --check $env:BASE_SHA HEAD
          } else {
            git show --format= --check HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:PR_TITLE -cnotmatch '^(feat|fix|chore|docs|refactor|test|perf|ci)(\([^)]+\))?!?: .+') {
            Write-Error 'PR title must follow Conventional Commits.'
            exit 1
          }
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - run: python -m pip install Pillow==12.3.0
      - run: npm run setup:lua-static
      - run: npm run check:network
      # Same commands and order as check:rules, with each phase visible in CI.
      - run: npm run verify:backlog
      - run: npm run check:syntax
      - run: npm test
      - run: npm run validate:data
      - run: npm run test:lua
      - run: npm run build:theme
      - run: npm run check:engineering
      - run: node scripts/write-ci-receipt.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}-check
          path: build/ci-checkout.json
          retention-days: 7
          if-no-files-found: error
  presentation:
    # These filesystem tests include symlinks; keep the local service unprivileged.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install Pillow==12.3.0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONUTF8: '1'
      - run: node scripts/build-ui.mjs
        env:
          ABYSS_PYTHON: python3
  engineering-posix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: python3 -m pip install Pillow==12.3.0
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - run: npm run setup:lua-static
      - run: npm test
        env:
          ABYSS_PYTHON: python3
      - run: npm run check:engineering
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/architecture.json
            build/lua-static.json
            build/lua-complexity.json
            build/test-strength/*/report.json
          retention-days: 7
          if-no-files-found: error
