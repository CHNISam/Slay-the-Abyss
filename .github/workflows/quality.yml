name: Quality
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      runner_pool:
        description: 'Hosted normally; local-special only for trusted develop/master platform diagnostics'
        type: choice
        default: hosted
        options: [hosted, local-special]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    name: rules (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ !cancelled() && (inputs.runner_pool != 'local-special' || github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')) }}
    # Only an explicit dispatch of a trusted integration branch may use the laptop.
    # All ordinary pushes and PRs, including forks, use a disposable hosted VM.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_pool == 'local-special' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') && fromJSON('["self-hosted", "Windows", "X64", "slay-the-abyss"]') || 'windows-2025' }}
    # Separate VMs isolate each shard's generated files. Never run JS files
    # concurrently inside one workspace: some exercise shared build outputs.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.runner_pool == 'local-special' && '[1]' || '[1,2,3,4,5,6,7,8]') }}
    timeout-minutes: ${{ inputs.runner_pool == 'local-special' && 75 || 30 }}
    defaults:
      run:
        shell: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_pool == 'local-special' && 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}' || 'pwsh -NoProfile -ExecutionPolicy Bypass -File {0}' }}
    steps:
      - name: Record execution environment and check free workspace space
        env:
          EXECUTION_ENVIRONMENT: ${{ runner.environment }}
          EXECUTION_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = Get-Item -LiteralPath $env:GITHUB_WORKSPACE
          if ($workspace.PSDrive.Free -lt 2GB) { throw 'Quality requires at least 2 GiB free before checkout/install' }
          node -e "const os=require('node:os'); console.log(JSON.stringify({runner:process.env.EXECUTION_NAME,environment:process.env.EXECUTION_ENVIRONMENT,os:os.platform(),cpus:os.cpus().length,memoryBytes:os.totalmem(),image:process.env.ImageOS,imageVersion:process.env.ImageVersion}))"
      - name: Check out exact revision on a fresh hosted VM
        if: runner.environment == 'github-hosted'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check out exact revision with installed Git
        if: runner.environment == 'self-hosted'
        env:
          CI_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Location).Path -ne $env:GITHUB_WORKSPACE) { throw 'Unexpected checkout directory' }
          if ($env:CI_SHA -cnotmatch '\A[0-9a-fA-F]{40}\z') { throw 'Invalid checkout SHA' }
          if ($env:CI_REF -cnotmatch '^refs/((heads|tags)/.+|pull/[1-9][0-9]*/merge)$') { throw 'Invalid checkout ref' }
          git check-ref-format $env:CI_REF
          if ($LASTEXITCODE -ne 0) { throw 'Invalid checkout ref' }
          # Hash the validated identity: branch names stay data, never shell/ref paths.
          $refHasher = [Security.Cryptography.SHA256]::Create()
          try { $refHash = $refHasher.ComputeHash([Text.Encoding]::UTF8.GetBytes($env:CI_REF)) } finally { $refHasher.Dispose() }
          $checkoutRef = 'refs/ci/quality-tips/' + [BitConverter]::ToString($refHash).Replace('-', '').ToLowerInvariant()
          git init .
          if ($LASTEXITCODE -ne 0) { throw 'Git initialization failed' }
          if (@(git remote) -contains 'origin') {
            git remote set-url origin "https://github.com/$env:CI_REPOSITORY.git"
          } else {
            git remote add origin "https://github.com/$env:CI_REPOSITORY.git"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Remote setup failed' }
          $previousHead = git rev-parse --verify --quiet HEAD
          if ($LASTEXITCODE -eq 0) {
            git update-ref refs/ci/previous $previousHead
            if ($LASTEXITCODE -ne 0) { throw 'Could not preserve previous checkout' }
          }
          function Get-PackBytes {
            $total = (Get-ChildItem -LiteralPath '.git/objects/pack' -Filter '*.pack' -File | Measure-Object -Property Length -Sum).Sum
            if ($null -eq $total) { return [long]0 }
            return [long]$total
          }
          $packBytesBefore = Get-PackBytes
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CI_TOKEN"))
          try {
            git -c credential.helper= -c fetch.unpackLimit=1 fetch --no-auto-maintenance --force --no-tags origin "+${env:CI_SHA}:refs/ci/current"
            if ($LASTEXITCODE -ne 0) { throw 'Git fetch failed' }
          } finally {
            Remove-Item Env:\GIT_CONFIG_COUNT, Env:\GIT_CONFIG_KEY_0, Env:\GIT_CONFIG_VALUE_0, Env:\CI_TOKEN
          }
          # Keep each PR/branch reachable across A -> B -> A fetch negotiation.
          git update-ref --no-deref $checkoutRef refs/ci/current
          if ($LASTEXITCODE -ne 0) { throw 'Could not preserve branch checkout' }
          # A bounded local cache, not a network budget: retain this tip plus the
          # 63 newest other tips by commit time. Evicted branches can download again.
          $maxCheckoutTips = 64
          $checkoutTips = @(git for-each-ref --sort=refname --sort=-committerdate --format='%(refname)' refs/ci/quality-tips/)
          if ($LASTEXITCODE -ne 0) { throw 'Could not list checkout tips' }
          foreach ($staleRef in @($checkoutTips | Where-Object { $_ -cmatch '^refs/ci/quality-tips/[0-9a-f]{64}$' -and $_ -cne $checkoutRef } | Select-Object -Skip ($maxCheckoutTips - 1))) {
            git update-ref --no-deref -d $staleRef
            if ($LASTEXITCODE -ne 0) { throw 'Could not retire old checkout tip' }
          }
          $receivedPackBytes = (Get-PackBytes) - $packBytesBefore
          Write-Output "Checkout new Git pack payload: $receivedPackBytes bytes"
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Checkout new Git pack payload: $receivedPackBytes bytes" }
          if ($receivedPackBytes -lt 0) { throw 'Git pack accounting changed unexpectedly' }
          if ($receivedPackBytes -gt 128MB) { throw 'Checkout exceeded 128 MiB; investigate before retrying' }
          if ($receivedPackBytes -gt 32MB) { Write-Output '::warning::Checkout received over 32 MiB; check whether this is an expected first download' }
          git checkout --force --detach refs/ci/current
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          if ((git rev-parse HEAD) -ne $env:CI_SHA) { throw 'Revision mismatch' }
          git clean -ffd
          if ($LASTEXITCODE -ne 0) { throw 'Workspace cleanup failed' }
      # Keep the measured runtime, every test and every fixture deadline.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      - name: Verify Node baseline
        run: node -e "if (process.versions.node !== '24.18.0') throw new Error('Quality requires Node 24.18.0'); console.log(process.version)"
      - name: Verify exact checkout and changed whitespace
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          # A missing shallow parent is expected, not a PowerShell native error.
          $PSNativeCommandUseErrorActionPreference = $false
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Revision mismatch' }
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            if ($env:BASE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid base SHA' }
            git cat-file -e "${env:BASE_SHA}^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              # Public origin, no persisted token, one bounded fetch for long pushes.
              git -c credential.helper= -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --depth=1 --no-auto-maintenance --no-tags origin $env:BASE_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Could not fetch exact comparison base' }
            }
            git diff --check $env:BASE_SHA HEAD
          } else {
            git show --format= --check HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:PR_TITLE -cnotmatch '^(feat|fix|chore|docs|refactor|test|perf|ci)(\([^)]+\))?!?: .+') {
            Write-Error 'PR title must follow Conventional Commits.'
            exit 1
          }
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/quality.yml
      - run: python -m pip install --disable-pip-version-check --retries 0 --timeout 30 Pillow==12.3.0
      - run: npm run setup:lua-static
      - run: npm run check:network
        if: matrix.shard == 1
      # One shard runs the non-test gates; all test files are partitioned
      # exactly once across the VMs, retaining both Windows and POSIX coverage.
      - run: npm run verify:backlog
        if: matrix.shard == 1
      - run: npm run check:syntax
        if: matrix.shard == 1
      - name: Materialize reviewed PNGs for this shard
        timeout-minutes: 2
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: node scripts/ci-reviewed-lfs.mjs --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: JavaScript regression shard
        run: |
          npm run build:data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/${{ strategy.job-total }} tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run validate:data
        if: matrix.shard == 1
      - name: Lua regression shard
        run: |
          node scripts/map-ui-layout.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-lua.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build:theme
        if: matrix.shard == 1
      - run: npm run check:engineering
        if: matrix.shard == 1
      - run: node scripts/write-ci-receipt.mjs
        if: matrix.shard == 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.shard == 1
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}-check
          path: build/ci-checkout.json
          retention-days: 7
          if-no-files-found: error
  check:
    # Preserve the required check name. A skipped/cancelled/missing shard must
    # never turn the aggregate green; fail-fast=false collects all shard results.
    needs: rules
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every regression shard
        env:
          RULES_RESULT: ${{ needs.rules.result }}
        run: test "$RULES_RESULT" = success
  presentation:
    # These filesystem tests include symlinks; keep the local service unprivileged.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/quality.yml
      - run: python3 -m pip install --disable-pip-version-check --retries 0 --timeout 30 Pillow==12.3.0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONUTF8: '1'
      - run: node scripts/build-ui.mjs
        env:
          ABYSS_PYTHON: python3
  engineering-posix-shards:
    name: engineering-posix (${{ matrix.shard }}/${{ strategy.job-total }})
    # Separate hosted VMs keep generated files isolated and retain the original
    # 20-minute budget. Node partitions every JS file once, serially per VM.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/quality.yml
      - run: python3 -m pip install --disable-pip-version-check --retries 0 --timeout 30 Pillow==12.3.0
      - run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - run: npm run setup:lua-static
      - name: Materialize reviewed PNGs for this shard
        timeout-minutes: 2
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: node scripts/ci-reviewed-lfs.mjs --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: POSIX JavaScript regression shard
        run: |
          npm run build:data
          npm run build:ui
          node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/${{ strategy.job-total }} tests/*.test.mjs
        env:
          ABYSS_PYTHON: python3
      - run: npm run check:engineering
        if: matrix.shard == 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.shard == 1
        with:
          name: engineering-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            build/architecture.json
            build/lua-static.json
            build/lua-complexity.json
            build/ui-complexity.json
            build/test-strength/*/report.json
          retention-days: 7
          if-no-files-found: error
  engineering-posix:
    # Preserve the required check name and reject every non-success outcome.
    needs: engineering-posix-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every POSIX regression shard
        env:
          ENGINEERING_RESULT: ${{ needs.engineering-posix-shards.result }}
        run: test "$ENGINEERING_RESULT" = success
