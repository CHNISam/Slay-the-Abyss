name: Quality
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify live remote execution authorization for exact PR head
        env:
          CLAIM_BRANCH: ${{ github.event.pull_request.head.ref }}
          CLAIM_SHA: ${{ github.event.pull_request.head.sha }}
          CLAIM_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CLAIM_TOKEN" | base64 -w0)"
          unset CLAIM_TOKEN
          node scripts/remote-task-claim.mjs verify-pr --branch "$CLAIM_BRANCH" --sha "$CLAIM_SHA"
  check:
    needs: ownership
    if: ${{ !cancelled() && (needs.ownership.result == 'success' || needs.ownership.result == 'skipped') }}
    concurrency:
      group: slay-the-abyss-full-quality
      cancel-in-progress: false
      queue: max
    # Fork code stays on GitHub-hosted infrastructure.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Windows", "X64", "slay-the-abyss"]') }}
    # Run 40141217243 exhausted 20 minutes after JS passed and only 123 of
    # 207 Lua fixtures had run on Node 22. Keep every fixture and its own
    # timeout; this bound allows the complete serial suite to finish.
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'pwsh -NoProfile -File {0}' || 'powershell -NoProfile -ExecutionPolicy Bypass -File {0}' }}
    steps:
      - name: Check out exact revision with installed Git
        env:
          CI_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.sha }}
          CI_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Location).Path -ne $env:GITHUB_WORKSPACE) { throw 'Unexpected checkout directory' }
          git init .
          if ($LASTEXITCODE -ne 0) { throw 'Git initialization failed' }
          if (git remote | Where-Object { $_ -eq 'origin' }) { git remote remove origin }
          git remote add origin "https://github.com/$env:CI_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw 'Remote setup failed' }
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CI_TOKEN"))
          try {
            git -c credential.helper= fetch --force --no-tags origin $env:CI_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Git fetch failed' }
          } finally {
            Remove-Item Env:\GIT_CONFIG_COUNT, Env:\GIT_CONFIG_KEY_0, Env:\GIT_CONFIG_VALUE_0, Env:\CI_TOKEN
          }
          git checkout --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          if ((git rev-parse HEAD) -ne $env:CI_SHA) { throw 'Revision mismatch' }
          git clean -ffd
          if ($LASTEXITCODE -ne 0) { throw 'Workspace cleanup failed' }
      # Both Windows runners must use the measured runtime, rather than their
      # different global Node installations. Keep every test and its budget.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Verify Node baseline
        run: node -e "if (process.versions.node !== '24.18.0') throw new Error('Quality requires Node 24.18.0'); console.log(process.version)"
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:BASE_SHA -and $env:BASE_SHA -notmatch '^0+$') {
            git diff --check $env:BASE_SHA HEAD
          } else {
            git show --format= --check HEAD
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ($env:PR_TITLE -cnotmatch '^(feat|fix|chore|docs|refactor|test|perf|ci)(\([^)]+\))?!?: .+') {
            Write-Error 'PR title must follow Conventional Commits.'
            exit 1
          }
      - run: npm ci --ignore-scripts
      # Same commands and order as check:rules, with each phase visible in CI.
      - run: npm run verify:backlog
      - run: npm run check:syntax
      - run: npm test
      - run: npm run validate:data
      - run: npm run test:lua
      - run: npm run build:theme
  presentation:
    # These filesystem tests include symlinks; keep the local service unprivileged.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONUTF8: '1'
      - run: node scripts/build-ui.mjs
        env:
          ABYSS_PYTHON: python3
